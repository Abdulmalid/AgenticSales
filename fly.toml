# Fly.io config for the AgenticSales API (the Python backend). Deploy from the repo root: `fly deploy`.
# One machine only: tenant data is SQLite on a single volume, so do not scale this horizontally.
app = "agenticsales-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENTIC_DATA_DIR = "/data"
  PORT = "8000"
  MODEL_PROVIDER = "gemini"

[[mounts]]
  source = "agentic_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # webhooks must always be answered, so never stop the machine
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
